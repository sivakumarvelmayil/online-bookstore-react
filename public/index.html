
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <!-- Application title -->
    <title>Book Nest | Online Bookstore</title>

    <!-- SEO metadata -->
    <meta
            name="description"
            content="Discover your next favourite read at Book Nest. Explore books, manage your cart, and enjoy a seamless online bookstore experience."
    />

    <meta
            name="keywords"
            content="online bookstore, books, Java books, programming books, fiction, Book Nest"
    />

    <meta name="author" content="BookNest" />

    <meta name="robots" content="index, follow" />

    <!-- Browser theme -->
    <meta name="theme-color" content="#263b32" />

    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Apple touch icon -->
    <link
            rel="apple-touch-icon"
            href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Open Graph metadata -->
    <meta property="og:title" content="BookNest | Online Bookstore" />

    <meta
            property="og:description"
            content="A little corner for readers. Discover thoughtful reads at Book Nest."
    />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="BookNest" />

    <!-- Application manifest -->
    <link
            rel="manifest"
            href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Preconnect for Google Fonts, if used in CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
    />
</head>

<body>
<noscript>
    <div style="padding: 20px; text-align: center;">
        JavaScript must be enabled to use Page & Pine Online Bookstore.
    </div>
</noscript>

<div id="root"></div>
</body>

</html>
